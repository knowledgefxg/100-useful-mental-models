<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#827b70">
<text x="600" y="240" font-size="20" letter-spacing="5">MODEL 100</text>
<text x="600" y="310" font-size="32">插图待补</text>
<text x="600" y="360" font-size="20">现时偏差</text></g></svg>