<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">现时偏差：插图占位</title><desc id="desc">同一个火柴人先在未来日历旁安排阅读，走到实际选择时却被眼前手机拉走；虚线回到预先准备好的阅读位置，表达偏好随即时性改变。</desc>
<rect width="1200" height="600" rx="20" fill="#f2eee5"/>
