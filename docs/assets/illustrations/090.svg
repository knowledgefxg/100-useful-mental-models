<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">乔哈里视窗：插图占位</title><desc id="desc">两位火柴人围绕半开的共享视窗交换拼图，一人指出另一人背后没看见的小补丁，另一人手中保留带盾牌的私人盒子；虚线表示自愿分享，细箭头表示反馈。</desc>
<rect width="1200" height="600" rx="20" fill="#f2eee5"/>
<rect x="28" y="28" width="1144" height="544" rx="12" fill="none" stroke="#d0c8ba" stroke-dasharray="8 8"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#827b70">
<text x="600" y="240" font-size="20" letter-spacing="5">MODEL 090</text>
<text x="600" y="310" font-size="32">插图待补</text>
<text x="600" y="360" font-size="20">乔哈里视窗</text></g></svg>